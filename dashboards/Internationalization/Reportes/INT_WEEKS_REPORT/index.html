<style>
:root{
  --pink:#E61166; --ink:#241420; --ink-soft:#6E5C68; --paper:#FAF8FA; --card:#FFFFFF;
  --line:#E9E2E7; --muted:#8C7F87; --income:#2E8B57; --income-soft:#E3F3EA;
  --expense:#C23B3B; --expense-soft:#FBE6E6; --balance:#1C6FA5; --balance-soft:#E1EEF7;
  --klu:#F2994A; --klu-soft:#FCEADA; --nova:#9B6FD1; --nova-soft:#EDE3F8;
  --fgv:#4FA8D8; --fgv-soft:#E1F1FA; --babson:#5FB88A; --babson-soft:#E2F3E9;
  --font-display:'Source Serif 4',Georgia,serif; --font-body:'Inter',-apple-system,Helvetica,Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:var(--font-body);}
h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0; color:var(--ink);}
p{line-height:1.6; margin:0;}
button{font-family:var(--font-body); cursor:pointer;}
:focus-visible{outline:2px solid var(--pink); outline-offset:2px;}

#topbar{position:sticky; top:0; z-index:50; background:var(--card); border-bottom:1px solid var(--line);}
#topbar-inner{max-width:1180px; margin:0 auto; padding:16px 28px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;}
.brand .eyebrow{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);}
.brand h1{font-size:19px;}
nav.tabs{display:flex; gap:4px; flex-wrap:wrap;}
nav.tabs button{border:1px solid var(--line); background:var(--paper); color:var(--ink-soft); font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:8px;}
nav.tabs button:hover{border-color:var(--muted); color:var(--ink);}
nav.tabs button.active{background:var(--ink); border-color:var(--ink); color:#fff;}
nav.tabs button .dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; vertical-align:middle;}

main{max-width:1180px; margin:0 auto; padding:32px 28px 80px;}
#mainViews{ max-width:none; margin:0; padding:0; width:100%; }
#viewport{ position:fixed; left:0; right:0; bottom:0; overflow:hidden; }
#mainViews{ display:flex; height:100%; transition:transform .55s cubic-bezier(.65,0,.35,1); }
.view{ flex:0 0 100vw; height:100%; overflow-y:auto; display:flex; flex-direction:column; align-items:center; padding:32px 28px 80px; }
.view > *{ width:100%; max-width:1180px; }
.subtitle{font-size:14.5px; color:var(--ink-soft); max-width:640px; margin-top:6px;}

.kpi-strip{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-top:20px;}
.kpi{background:var(--card); padding:16px 16px;}
.kpi-value{font-family:var(--font-mono); font-size:18px; font-weight:600; color:var(--ink); line-height:1.25; word-break:break-word;}
.kpi-value.income{color:var(--income);}
.kpi-value.expense{color:var(--expense);}
.kpi-value.balance{color:var(--balance);}
.kpi-label{font-size:11px; color:var(--muted); margin-top:5px;}
.kpi.income-bg{background:var(--income-soft);}
.kpi.expense-bg{background:var(--expense-soft);}
.kpi.balance-bg{background:var(--balance-soft);}

.card{border:1px solid var(--line); border-radius:14px; background:var(--card); padding:22px 24px; margin-top:20px;}
.fin-hero{display:flex; gap:20px; align-items:stretch; flex-wrap:wrap;}
.fin-stack{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; width:220px; flex:0 0 220px;}
.fin-stack .kpi{padding:14px 16px;}
.margin-box{width:150px; flex:0 0 150px; border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:10px;}
.margin-box .kpi-value{font-size:26px;}
.fin-hero-chart{flex:1; min-width:280px; border:1px solid var(--line); border-radius:12px; padding:14px 18px;}
.fin-hero-chart h3{font-size:13px; margin-bottom:2px;}

.card h3{font-size:15px; margin-bottom:4px;}
.card .card-note{font-size:12px; color:var(--muted); margin-bottom:14px;}
.subtle-reset{ font-family:var(--font-mono); font-size:11px; color:var(--muted); background:none; border:none; cursor:pointer; text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px; padding:0; }
.subtle-reset:hover{ color:var(--ink); }
.ov-map-wrap{ position:relative; }
.ov-selected-overlay{ position:absolute; top:44px; right:10px; width:270px; z-index:5; box-shadow:0 10px 30px rgba(36,20,32,.14); }
.ov-selected-overlay .partner-card{ margin:0; background:var(--card); }
@media (max-width:760px){ .ov-selected-overlay{ position:static; width:100%; margin-top:14px; box-shadow:none; } }
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media (max-width:820px){.two-col{grid-template-columns:1fr;} .fin-stack, .margin-box{width:100%; flex:1 1 100%;}}

.partner-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:16px; margin-top:20px;}
.ov-map-layout{display:block;}
#ovMapSideChart .partner-card{margin-top:0;}
.partner-card{border-radius:14px; padding:20px; border:1px solid var(--line); background:var(--card); border-top:5px solid var(--week-color,var(--pink)); cursor:pointer; transition:transform .15s;}
.partner-card:hover{transform:translateY(-2px); box-shadow:0 8px 24px rgba(36,20,32,.08);}
.partner-card img.logo{height:26px; max-width:120px; object-fit:contain; object-position:left; display:block; margin-bottom:14px;}
.partner-card .loc{font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-bottom:14px;}
.partner-card .n{font-family:var(--font-display); font-size:30px; font-weight:600;}
.partner-card .n-label{font-size:11.5px; color:var(--ink-soft); margin-bottom:12px;}
.partner-card .gender-row{display:flex; gap:18px; font-size:17px; font-weight:600; font-family:var(--font-mono); color:var(--ink); margin-bottom:16px;}
.partner-card .fin-row{display:flex; justify-content:space-between; border-top:1px solid var(--line); padding-top:10px; font-size:12px; gap:8px;}
.partner-card .fin-row .val{font-family:var(--font-mono); font-weight:600; text-align:right;}
.partner-card .fin-row.income .val{color:var(--income);}
.partner-card .fin-row.expense .val{color:var(--expense);}
.partner-card .margin-pill{display:inline-block; margin-top:10px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; background:var(--week-soft,#EEE); color:var(--week-color,var(--ink));}

.week-band{border-radius:16px; padding:26px 30px; display:flex; align-items:center; gap:24px; flex-wrap:wrap;}
.week-band img.logo{height:34px; max-width:150px; object-fit:contain; background:#fff; padding:8px 14px; border-radius:10px;}
.week-band .info{flex:1; min-width:240px;}
.week-band .info .eyebrow{font-family:var(--font-mono); font-size:11px; color:var(--week-color); text-transform:uppercase; letter-spacing:.06em; font-weight:600;}
.week-band .info h2{font-size:20px; margin-top:4px;}
.week-band .info .loc{font-size:12.5px; color:var(--ink-soft); margin-top:6px;}
.week-band .prof{display:flex; align-items:center; gap:10px; background:#fff; border-radius:12px; padding:8px 14px 8px 8px;}
.week-band .prof img{width:44px; height:44px; border-radius:50%; object-fit:cover;}
.week-band .prof .pname{font-weight:600; font-size:13px;}
.week-band .prof .prole{font-size:10.5px; color:var(--muted); font-family:var(--font-mono); text-transform:uppercase;}

.week-hero{display:flex; gap:16px; align-items:stretch; flex-wrap:wrap;}
.week-hero-main{flex:2; min-width:320px; display:flex; flex-direction:column; gap:16px;}
.week-hero-map{flex:1; min-width:260px; margin-top:0;}
.week-hero .kpi-strip{margin-top:0;}

.pdf-btn-row{margin-top:24px; text-align:center;}
.pdf-btn{background:var(--ink); color:#fff; border:none; border-radius:8px; padding:12px 22px; font-size:13px; font-weight:600;}
.pdf-btn:hover{opacity:.85;}

table.datatable{width:100%; border-collapse:collapse; font-size:12.5px;}
table.datatable th{text-align:left; font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
table.datatable td{padding:8px 10px; border-bottom:1px solid var(--line);}
table.datatable tbody tr:hover{background:var(--paper);}
table.datatable tbody tr.not-abroad{opacity:.55;}
.table-scroll{max-height:460px; overflow-y:auto; border:1px solid var(--line); border-radius:10px;}
.table-scroll table.datatable th{position:sticky; top:0; background:var(--card); z-index:2;}
.tick{color:var(--income); font-weight:700;}
.cross{color:var(--expense); font-weight:700;}
.pill{display:inline-block; padding:2px 9px; border-radius:20px; font-size:10.5px; font-weight:600; font-family:var(--font-mono);}
.pill.complete{background:var(--income-soft); color:var(--income);}
.pill.pending{background:var(--expense-soft); color:var(--expense);}

.fin-compare td, .fin-compare th{text-align:right;}
.fin-compare td:first-child, .fin-compare th:first-child{text-align:left;}
.fin-compare tr.total td{font-weight:700; border-top:2px solid var(--ink);}
.week-chip{display:inline-flex; align-items:center; gap:6px; font-weight:600;}
.week-chip .dot{width:8px; height:8px; border-radius:50%;}

.fin-detail-week{border-radius:14px; padding:22px 24px; margin-top:20px; border:1px solid var(--line); border-top:5px solid var(--week-color);}
.fin-detail-week h3{font-size:16px;}
.trm-note{font-family:var(--font-mono); font-size:11px; color:var(--muted); margin:6px 0 16px;}
.fin-subtotal{display:flex; justify-content:space-between; font-size:13px; font-weight:700; padding:10px 10px 4px; border-top:2px solid var(--ink); margin-top:4px;}


footer.report-footer{text-align:center; padding:40px 0 10px; font-size:11.5px; color:var(--muted); font-family:var(--font-mono);}

/* ---------- Brand logo (top-left, returns to Data Center) ---------- */
.brand-logo-link{ display:flex; align-items:center; cursor:pointer; }
.brand-logo-link img{ height:38px; width:auto; display:block; }
.brand-logo-fallback{ display:none; flex-direction:column; line-height:1.1; }
.brand-logo-fallback .b1{ font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--pink); }
.brand-logo-fallback .b2{ font-family:var(--font-mono); font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }

.back-to-eiv{
  display:flex; align-items:center; gap:8px; padding:7px 12px 7px 7px; border:1px solid var(--line);
  border-radius:20px; background:var(--paper); text-decoration:none; color:var(--ink-soft);
  font-family:var(--font-mono); font-size:11px; white-space:nowrap;
}
.back-to-eiv:hover{ border-color:var(--pink); color:var(--pink); }
.back-to-eiv img{ height:20px; width:20px; border-radius:50%; object-fit:cover; display:block; }
.back-to-eiv .eiv-fallback{ display:none; width:20px; height:20px; border-radius:50%; background:var(--pink-soft); color:var(--pink); align-items:center; justify-content:center; font-weight:700; font-size:9px; font-family:var(--font-display); }

/* ---------- Data Center ---------- */
.datacenter{ max-width:640px; margin:50px auto; }
.datacenter .banner{ width:100%; height:auto; display:block; border-radius:12px; margin-bottom:34px; }
.datacenter .eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--pink); font-weight:600; margin-bottom:8px; }
.datacenter .subtitle{ margin-top:8px; margin-bottom:26px; }
.filelist{ list-style:none; margin:0 0 22px; padding:0; }
.filelist li{ display:flex; align-items:center; gap:12px; padding:11px 2px; border-bottom:1px solid var(--line); }
.filelist .dot{ width:7px; height:7px; border-radius:50%; background:var(--muted); flex:0 0 auto; }
.filelist .dot.ok{ background:var(--income); }
.filelist .fname{ font-family:var(--font-mono); font-size:13px; color:var(--ink); }
.filelist .fstatus{ font-size:12.5px; color:var(--muted); flex:1; text-align:right; padding-right:18px; }
.filelist .file-download{
  font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); background:none; border:none;
  cursor:pointer; text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px; white-space:nowrap;
}
.filelist .file-download:hover{ color:var(--pink); }
.summary-line{ font-size:13px; color:var(--ink-soft); margin-bottom:22px; }
.summary-line strong{ color:var(--ink); }
.enter-btn{ background:var(--ink); color:#fff; border:none; border-radius:9px; padding:14px 26px; font-size:14px; font-weight:600; cursor:pointer; }
.enter-btn:hover{ opacity:.88; }
</style>
</head>

/* International Weeks 2026 — rendering logic. Reads DATA (above) and
   builds the DOM + Plotly charts. No network calls, no build step. */

const fmt = n => (n<0?'-':'') + '$' + Math.round(Math.abs(n)).toLocaleString('en-US');
const FLAGS = {Germany:'🇩🇪', Portugal:'🇵🇹', Brazil:'🇧🇷', USA:'🇺🇸'};
const GEO_SCOPE = {DEU:'europe', PRT:'europe', BRA:'south america', USA:'usa'};

/* ---------- Nav ---------- */
function buildNav(){
  const tabs = [{id:'overview', label:'Overview'}]
    .concat(DATA.weeks.map(w => ({id:w.key, label:w.key, color:w.color})))
    .concat([{id:'financial', label:'Financial Detail'}]);
  document.getElementById('tabNav').innerHTML = tabs.map(t =>
    '<button data-tab="'+t.id+'" onclick="showView(\''+t.id+'\')">'
    + (t.color ? '<span class="dot" style="background:'+t.color+'"></span>' : '')
    + t.label + '</button>'
  ).join('');
}

function tabOrder(){
  return ['datacenter', 'overview'].concat(DATA.weeks.map(w=>w.key)).concat(['financial']);
}

let currentViewId = null;

function showView(id){
  const isWeek = k => DATA.weeks.some(w => w.key === k);
  const cameFromWeek = currentViewId && isWeek(currentViewId);
  const goingToWeek = isWeek(id);

  const order = tabOrder();
  const idx = order.indexOf(id);
  document.getElementById('mainViews').style.transform = 'translateX(-' + (idx*100) + 'vw)';

  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.getElementById('tabNav').style.display = (id === 'datacenter') ? 'none' : 'flex';
  updateViewportTop();
  const el = document.getElementById('view-' + id);
  if(!el.dataset.rendered){
    el.dataset.rendered = '1';
    if(id === 'datacenter'){ /* static content, nothing to render */ }
    else if(id === 'overview') renderOverviewCharts();
    else if(id === 'financial') renderFinancialCharts();
    else renderWeekCharts(id);
  }
  // Week ↔ week keeps the scroll position (each .view now scrolls
  // independently and stays in the DOM, so this happens naturally) — you
  // can flip between weeks and compare the same section side by side.
  if(!(cameFromWeek && goingToWeek)) el.scrollTop = 0;
  currentViewId = id;
}

function updateViewportTop(){
  const topbar = document.getElementById('topbar');
  const vp = document.getElementById('viewport');
  if(topbar && vp) vp.style.top = topbar.offsetHeight + 'px';
}
window.addEventListener('resize', updateViewportTop);
window.addEventListener('load', updateViewportTop);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(updateViewportTop);

}

function computeProgramByWeek(onlyKey){
  const totals = {}, byProgWeek = {};
  const weeks = onlyKey ? DATA.weeks.filter(w=>w.key===onlyKey) : DATA.weeks;
  weeks.forEach(w=>{
    (w.participantsList||[]).filter(p=>p.matricula).forEach(p=>{
      const prog = p.programa || 'Unspecified';
      totals[prog] = (totals[prog]||0)+1;
      byProgWeek[prog] = byProgWeek[prog] || {};
      byProgWeek[prog][w.key] = (byProgWeek[prog][w.key]||0)+1;
    });
  });
  const programs = Object.keys(totals).sort((a,b)=>totals[b]-totals[a]);
  return {programs, byProgWeek, weeks};
}

function renderProgramChart(onlyKey){
  const {programs, byProgWeek, weeks} = computeProgramByWeek(onlyKey);
  if(!programs.length){ Plotly.purge('ovProgramChart'); return; }
  const traces = weeks.map(w => ({
    type:'bar', orientation:'h', name:w.key,
    x: programs.map(p => (byProgWeek[p] && byProgWeek[p][w.key]) || 0),
    y: programs, marker:{color:w.color},
  }));
  Plotly.newPlot('ovProgramChart', traces, {
    barmode:'stack',
    margin:{t:6, r:16, b:26, l:170},
    legend:{orientation:'h', x:0, y:1.12},
    xaxis:{gridcolor:'#EFEBEE'},
    yaxis:{tickfont:{size:10}, automargin:true, categoryorder:'array', categoryarray:programs, autorange:'reversed'},
    plot_bgcolor:'rgba(0,0,0,0)', paper_bgcolor:'rgba(0,0,0,0)',
    font:{family:'Inter', color:'#241420'}
  }, {displayModeBar:false, responsive:true});
}

  document.getElementById('ovProgramNote').textContent = 'Highest-enrollment program first, for '+w.key+' only.';

}

// Mirrored pyramid axis: nice symmetric ticks around 0 covering both sides.
function autoTicks(women, men){
  const m = Math.max(...women.map(Math.abs), ...men.map(Math.abs), 1);
  const step = Math.ceil(m/4) || 1;
  const ticks = [];
  for(let v=-step*4; v<=step*4; v+=step) ticks.push(v);
  return ticks;
}

   Same visual language as the standalone Course Evaluation Report
   Generator (stacked bars per question, NPS gradient, legends), just
   themed with the week's own color instead of an uploaded logo. */
const LIKERT_ORDER = ['Totalmente en desacuerdo','En desacuerdo','Ni de acuerdo ni en desacuerdo','De acuerdo','Totalmente de acuerdo'];
const LIKERT_COL = {'Totalmente en desacuerdo':[210,45,45],'En desacuerdo':[255,112,67],'Ni de acuerdo ni en desacuerdo':[255,193,7],'De acuerdo':[139,195,74],'Totalmente de acuerdo':[46,125,50]};
const WL_ORDER = ['Nada','Poco','Mucho','Demasiado'];
const WL_COL = {'Nada':[46,125,50],'Poco':[139,195,74],'Mucho':[255,112,67],'Demasiado':[210,45,45]};
const OBJ_ORDER = ['Ninguno','Algunos','Todos'];
const OBJ_COL = {'Ninguno':[210,45,45],'Algunos':[255,193,7],'Todos':[46,125,50]};
const NPS_COL = {0:[210,45,45],1:[220,55,55],2:[225,85,55],3:[240,110,40],4:[255,145,0],5:[255,190,0],6:[205,215,55],7:[155,200,80],8:[95,175,95],9:[55,155,75],10:[25,135,55]};

function pdfCheckPage(doc, y, needed, pageH, drawHeader){
  if(y + needed > pageH - 16){ doc.addPage(); drawHeader(); return 32; }
  return y;
}

function pdfStackedBar(doc, opts, order, colorMap, x, y, w, h){
  let total = 0; order.forEach(k=> total += (opts[k]||0));
  if(!total) return y+h+2;
  let cx = x;
  order.forEach(k=>{
    const n = opts[k]||0; if(!n) return;
    const sw = w*(n/total), col = colorMap[k]||[180,180,180];
    doc.setFillColor(col[0],col[1],col[2]); doc.rect(cx,y,sw,h,'F');
    if(sw>14){ doc.setFontSize(6.5); doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.text(Math.round(n/total*100)+'%', cx+sw/2, y+h/2+2.2, {align:'center'}); }
    cx += sw;
  });
  doc.setDrawColor(200,200,200); doc.setLineWidth(0.2); doc.rect(x,y,w,h);
  return y+h+2;
}

function pdfLegend(doc, opts, order, colorMap, x, y, w){
  let lx = x; doc.setFontSize(6.5);
  order.forEach(k=>{
    const n = opts[k]||0; if(!n) return;
    const col = colorMap[k]||[180,180,180];
    doc.setFillColor(col[0],col[1],col[2]); doc.rect(lx,y,3.5,3.2,'F');
    doc.setTextColor(36,20,32);
    const lbl = k+' ('+n+')';
    doc.text(lbl, lx+5, y+3.2);
    lx += doc.getTextWidth(lbl)+8;
    if(lx > x+w-24){ lx=x; y+=5; }
  });
  return y+6;
}

function pdfNpsBar(doc, opts, x, y, w, h){
  const sw = w/11;
  doc.setFontSize(6); doc.setTextColor(140,127,135); doc.setFont('helvetica','normal');
  for(let i=0;i<=10;i++) doc.text(String(i), x+i*sw+sw/2, y-2, {align:'center'});
  for(let i=0;i<=10;i++){
    const n = opts[String(i)]||0, col = NPS_COL[i];
    doc.setFillColor(col[0],col[1],col[2]); doc.rect(x+i*sw, y, sw-0.4, h, 'F');
    if(n>0){ doc.setFontSize(7); doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.text(String(n), x+i*sw+sw/2, y+h/2+2.5, {align:'center'}); }
  }
  doc.setDrawColor(200,200,200); doc.setLineWidth(0.2); doc.rect(x,y,w,h);
  return y+h+3;
}

function generateWeekPDF(key){
  const w = DATA.weeks.find(x => x.key === key);
  const S = w.survey;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});
  const c = hexToRgb(w.color), pW = 210, pH = 297, mg = 14, cW = pW-2*mg;
  let pn = 1;

  const drawHeader = () => {
    doc.setFillColor(c[0],c[1],c[2]); doc.rect(0,0,pW,22,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(9);
    doc.text(w.professor, pW-mg, 9, {align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    doc.text(w.course, pW-mg, 15, {align:'right'});
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text(w.name, mg, 12);
  };
  const drawFooter = () => {
    doc.setFillColor(248,246,248); doc.rect(0,pH-11,pW,11,'F');
    doc.setTextColor(140,127,135); doc.setFont('helvetica','normal'); doc.setFontSize(7);
    doc.text('International Weeks 2026 — Course Evaluation', mg, pH-4);
    doc.text(String(pn), pW-mg, pH-4, {align:'right'});
  };

  // ---- Cover ----
  doc.setFillColor(c[0],c[1],c[2]); doc.rect(0,0,pW,70,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(18);
  doc.text('Course Evaluation Report', pW/2, 30, {align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text(w.name, pW/2, 40, {align:'center'});
  doc.setFontSize(9);
  doc.text(w.location+', '+w.country+' · '+w.dates, pW/2, 48, {align:'center'});

  doc.setFillColor(255,255,255); doc.roundedRect(mg, 80, cW, 40, 5, 5, 'F');
  doc.setFillColor(c[0],c[1],c[2]); doc.roundedRect(mg, 80, 4, 40, 2, 2, 'F');
  doc.setTextColor(c[0],c[1],c[2]); doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text(w.professor, mg+10, 96);
  doc.setTextColor(36,20,32); doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  doc.text(w.course, mg+10, 104);
  doc.setTextColor(140,127,135); doc.setFontSize(8);
  doc.text('Faculty Lead — International Week', mg+10, 111);

  let y = 132;
  doc.setTextColor(36,20,32); doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('SURVEY OVERVIEW', mg, y); y += 9;
  const stats = [
    ['Students Responded', S.respondents+' / '+w.abroadCount], ['Response Rate', S.responseRate+'%'],
    ['Avg. Satisfaction', S.avg!=null ? S.avg+' / 5.0' : 'N/A'],
  ];
  const bw = cW/3;
  stats.forEach((s,i)=>{
    const bx = mg+i*bw;
    doc.setFillColor(248,246,248); doc.roundedRect(bx+1, y, bw-3, 30, 4, 4, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(c[0],c[1],c[2]);
    doc.text(s[1], bx+bw/2-1, y+15, {align:'center'});
    doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(140,127,135);
    doc.text(s[0], bx+bw/2-1, y+23, {align:'center'});
  });
  drawFooter();

  // ---- Classify questions ----
  const qLikert=[], qNPS=[], qObj=[], qCarga=[];
  S.questions.forEach(q=>{
    if(q.type==='acuerdo') qLikert.push(q);
    else if(q.type==='escala010') qNPS.push(q);
    else if(q.type==='cantidad') qObj.push(q);
    else if(q.type==='carga') qCarga.push(q);
  });

  // ---- Quantitative: Likert by aspect ----
  doc.addPage(); pn++; drawHeader(); drawFooter(); y = 32;
  doc.setFillColor(c[0],c[1],c[2]); doc.rect(mg,y,cW,7.5,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
  doc.text('QUANTITATIVE EVALUATION', mg+5, y+5.3); y += 11;

  const byAspect = {};
  qLikert.forEach(q=>{ (byAspect[q.aspect] = byAspect[q.aspect]||[]).push(q); });
  Object.keys(byAspect).forEach(asp=>{
    y = pdfCheckPage(doc, y, 22, pH, ()=>{ drawHeader(); drawFooter(); });
    doc.setFillColor(230,226,231); doc.rect(mg,y,cW,6.5,'F');
    doc.setTextColor(36,20,32); doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
    doc.text(asp.toUpperCase(), mg+4, y+4.6); y += 9.5;
    byAspect[asp].forEach(q=>{
      const qLines = doc.splitTextToSize(q.text, cW-26);
      const needed = qLines.length*4 + 7 + 14;
      y = pdfCheckPage(doc, y, needed, pH, ()=>{ drawHeader(); drawFooter(); });
      doc.setTextColor(36,20,32); doc.setFont('helvetica','normal'); doc.setFontSize(8);
      doc.text(qLines, mg, y);
      const total = Object.values(q.options).reduce((a,b)=>a+b,0);
      if(total){
        doc.setFillColor(248,246,248); doc.roundedRect(mg+cW-22, y-4, 22, 6, 2, 2, 'F');
        doc.setFontSize(7); doc.setTextColor(140,127,135);
        doc.text('n='+total, mg+cW-11, y+0.5, {align:'center'});
      }
      y += qLines.length*4+3;
      y = pdfStackedBar(doc, q.options, LIKERT_ORDER, LIKERT_COL, mg, y, cW, 7);
      y = pdfLegend(doc, q.options, LIKERT_ORDER, LIKERT_COL, mg, y, cW);
      doc.setDrawColor(230,230,230); doc.line(mg,y,mg+cW,y); y += 5;
    });
    y += 2;
  });

  // ---- NPS / Objectives / Workload ----
  if(qNPS.length || qObj.length || qCarga.length){
    doc.addPage(); pn++; drawHeader(); drawFooter(); y = 32;
  }
  if(qNPS.length){
    doc.setFillColor(c[0],c[1],c[2]); doc.rect(mg,y,cW,7.5,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
    doc.text('RECOMMENDATION (0-10)', mg+5, y+5.3); y += 11;
    qNPS.forEach(q=>{
      const qLines = doc.splitTextToSize(q.text, cW-4);
      y = pdfCheckPage(doc, y, qLines.length*4+20, pH, ()=>{ drawHeader(); drawFooter(); });
      doc.setTextColor(36,20,32); doc.setFont('helvetica','normal'); doc.setFontSize(8);
      doc.text(qLines, mg, y); y += qLines.length*4+5;
      y = pdfNpsBar(doc, q.options, mg, y, cW, 10) + 4;
    });
  }
  if(qObj.length){
    y = pdfCheckPage(doc, y, 24, pH, ()=>{ drawHeader(); drawFooter(); });
    doc.setFillColor(c[0],c[1],c[2]); doc.rect(mg,y,cW,7.5,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
    doc.text('COURSE OBJECTIVES', mg+5, y+5.3); y += 11;
    qObj.forEach(q=>{
      const qLines = doc.splitTextToSize(q.text, cW-4);
      y = pdfCheckPage(doc, y, qLines.length*4+20, pH, ()=>{ drawHeader(); drawFooter(); });
      doc.setTextColor(36,20,32); doc.setFont('helvetica','normal'); doc.setFontSize(8);
      doc.text(qLines, mg, y); y += qLines.length*4+3;
      y = pdfStackedBar(doc, q.options, OBJ_ORDER, OBJ_COL, mg, y, cW, 7);
      y = pdfLegend(doc, q.options, OBJ_ORDER, OBJ_COL, mg, y, cW) + 2;
    });
  }
  if(qCarga.length){
    y = pdfCheckPage(doc, y, 24, pH, ()=>{ drawHeader(); drawFooter(); });
    doc.setFillColor(c[0],c[1],c[2]); doc.rect(mg,y,cW,7.5,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
    doc.text('ACADEMIC WORKLOAD', mg+5, y+5.3); y += 11;
    qCarga.forEach(q=>{
      const qLines = doc.splitTextToSize(q.text, cW-4);
      y = pdfCheckPage(doc, y, qLines.length*4+20, pH, ()=>{ drawHeader(); drawFooter(); });
      doc.setTextColor(36,20,32); doc.setFont('helvetica','normal'); doc.setFontSize(8);
      doc.text(qLines, mg, y); y += qLines.length*4+3;
      y = pdfStackedBar(doc, q.options, WL_ORDER, WL_COL, mg, y, cW, 7);
      y = pdfLegend(doc, q.options, WL_ORDER, WL_COL, mg, y, cW) + 2;
    });
  }

  // ---- Comments ----
  if(S.commentGroups.some(g=>g.n)){
    doc.addPage(); pn++; drawHeader(); drawFooter(); y = 32;
    doc.setFillColor(c[0],c[1],c[2]); doc.rect(mg,y,cW,7.5,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
    doc.text('OPEN COMMENTS', mg+5, y+5.3); y += 11;
    S.commentGroups.forEach(g=>{
      if(!g.n) return;
      y = pdfCheckPage(doc, y, 20, pH, ()=>{ drawHeader(); drawFooter(); });
      doc.setFillColor(248,246,248); doc.rect(mg,y,cW,6.5,'F');
      doc.setFillColor(c[0],c[1],c[2]); doc.rect(mg,y,3,6.5,'F');
      doc.setTextColor(36,20,32); doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
      doc.text(g.label.toUpperCase()+' ('+g.n+')', mg+6, y+4.6); y += 10;
      g.items.forEach(t=>{
        const lines = doc.splitTextToSize('- '+t, cW-4);
        const needed = lines.length*4.5+3;
        y = pdfCheckPage(doc, y, needed, pH, ()=>{ drawHeader(); drawFooter(); });
        doc.setFont('helvetica','normal'); doc.setFontSize(7.8); doc.setTextColor(80,72,78);
        doc.text(lines, mg+2, y); y += needed;
      });
      y += 6;
    });
  }

  doc.save('ISS_2026_' + w.key + '_Evaluation_Report.pdf');
}

function hexToRgb(hex){
  const n = parseInt(hex.replace('#',''), 16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}

/* ---------- Data Center ---------- */
function datacenterHTML(){
  const files = [
    {file:'BD_listas.xlsx', desc:'Enrollment, payments & program catalog per week'},
    {file:'BD_presupuesto.xlsx', desc:'Budget by concept — income & expenses, per week'},
    {file:'BD_semanas.xlsx', desc:'Week metadata — professor, dates, location, invoice'},
    {file:'BD_encuesta_curso.xlsx', desc:'Course evaluation survey — frecuencias & comentarios'},
  ];
  return '<div class="datacenter">'
  + '<img class="banner" src="PICS/LOGOS/Banner_Semanas.jpg" alt="International Weeks 2026" onerror="this.style.display=\'none\'">'
  + '<div class="eyebrow">International Weeks 2026 · Report</div>'
  + '<h1>Data Center</h1>'
  + '<p class="subtitle">Verification of the sources powering this report.</p>'
  + '<ul class="filelist">' + files.map(f =>
      '<li title="'+f.desc+'"><span class="dot ok"></span><span class="fname">'+f.file+'</span><span class="fstatus">Loaded (bundled)</span>'
      + '<a class="file-download" href="DATA/'+f.file+'" download>&#8595; Download</a></li>'

  + '<button class="enter-btn" onclick="showView(\'overview\')">Enter the Report &#8594;</button>'
  + '</div>';
}

function boot(){
  buildNav();
  const views = ['<div class="view" id="view-datacenter">'+datacenterHTML()+'</div>']
    .concat(['<div class="view" id="view-overview">'+overviewHTML()+'</div>'])
    .concat(DATA.weeks.map(w => '<div class="view" id="view-'+w.key+'">'+weekHTML(w)+'</div>'))
    .concat(['<div class="view" id="view-financial">'+financialHTML()+'<footer class="report-footer">International Weeks 2026 · Facultad de Administración · Universidad de los Andes</footer></div>']);
  document.getElementById('mainViews').innerHTML = views.join('');
  document.getElementById('view-datacenter').dataset.rendered = '1';
  updateViewportTop();
  showView('datacenter');
}
boot();
